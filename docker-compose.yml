services:

  mongodb:
    image: mongo:8
    container_name: skillswap-mongodb
    volumes:
      - skillswap-mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    image: skillswap-backend:latest
    container_name: skillswap-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/skillswap
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: skillswap-frontend:latest
    container_name: skillswap-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  skillswap-mongo-data: