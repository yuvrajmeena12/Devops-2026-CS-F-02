<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student | StudentHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">StudentHub</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
        <a href="dashboard.html">Dashboard</a>
    </div>
</nav>

<main class="form-page">

    <div class="form-header">
        <span class="badge">NEW REGISTRATION</span>

        <h1>Register a Student</h1>

        <p>
            Enter the student's details below to create
            a registration record.
        </p>
    </div>

    <form id="registrationForm" class="registration-form">

        <div class="form-grid">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter full name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="student@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input
                    type="tel"
                    name="phone"
                    placeholder="10 digit phone number"
                    pattern="[0-9]{10}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input
                    type="date"
                    name="dob"
                    required
                >
            </div>

            <div class="form-group">
                <label>Gender</label>

                <select name="gender" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>College</label>

                <input
                    type="text"
                    name="college"
                    placeholder="Enter college name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Course</label>

                <input
                    type="text"
                    name="course"
                    placeholder="Example: B.Tech CSE"
                    required
                >
            </div>

            <div class="form-group">
                <label>Year</label>

                <select name="year" required>
                    <option value="">Select year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>

            <div class="form-group">
                <label>Roll Number</label>

                <input
                    type="text"
                    name="rollNumber"
                    placeholder="Enter roll number"
                    required
                >
            </div>

            <div class="form-group full-width">
                <label>Address</label>

                <textarea
                    name="address"
                    placeholder="Enter complete address"
                    rows="4"
                    required
                ></textarea>
            </div>

        </div>

        <button type="submit" class="btn primary submit-btn">
            Submit Registration
        </button>

        <p id="message" class="message"></p>

    </form>

</main>

<footer>
    StudentHub © 2026 | Student Registration System
</footer>

<script src="register.js"></script>

</body>
</html>
