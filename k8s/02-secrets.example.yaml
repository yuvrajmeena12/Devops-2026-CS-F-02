# Example template for Kubernetes Secrets.
# For production/demonstration, generate the actual k8s/02-secrets.yaml with base64-encoded credentials.
apiVersion: v1
kind: Secret
metadata:
  name: skillswap-secret
  namespace: skillswap
  labels:
    app.kubernetes.io/name: skillswap-secret
    app.kubernetes.io/part-of: skillswap-platform
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-secure-jwt-secret-key"
  # Service discovery resolves to mongodb-service within the skillswap namespace
  MONGO_URI: "mongodb://mongodb-service:27017/skillswap"
