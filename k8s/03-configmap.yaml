apiVersion: v1
kind: ConfigMap
metadata:
  name: skillswap-config
  namespace: skillswap
  labels:
    app.kubernetes.io/name: skillswap-config
    app.kubernetes.io/part-of: skillswap-platform
data:
  PORT: "5000"
  NODE_ENV: "production"
  # Allowed CORS origins including standard Vite port, NodePorts, and local IPs
  CLIENT_URL: "http://localhost:5173,http://localhost:30173,http://127.0.0.1:5173,http://127.0.0.1:30173,http://localhost:8080,*"
  # Frontend browser-accessible API endpoint
  VITE_API_URL: "http://localhost:5000/api"
